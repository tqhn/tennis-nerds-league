<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Event Creator | TennisNerds</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="dtc-favicon.png">
    <style>
        .session-list { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
        .management-card {
            border: 2px solid var(--color-primary-accent);
            padding: 15px;
            border-radius: 8px;
            background: var(--color-white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .card-info { flex: 1; }
        .card-title {
            margin: 0 0 5px 0;
            color: var(--color-primary-accent);
            font-size: 0.95em;
            line-height: 1.3;
        }
        .card-meta { font-size: 0.8em; color: #666; margin-bottom: 2px; }
        
        /* Interactive Badges */
        .status-badge {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;
        }
        .status-badge.active { background: #effce0; color: var(--color-secondary-accent); }
        .status-badge.past { background: #f2f2f2; color: #777; }
        .status-badge.cancelled { background: #fce4d6; color: #d9534f; }
        
        .cancel-action-btn {
            background: #d9534f; color: white; border: none; padding: 8px 14px;
            border-radius: 5px; font-weight: 700; font-size: 0.8em; cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
        
        #form-section { margin-top: 25px; padding: 20px; background: var(--color-light-bg); border-radius: 8px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        label { font-weight: bold; font-size: 0.85em; color: var(--color-primary-accent); }
    </style>
</head>
<body>
<div class="container">
    <div id="header-placeholder"></div>
            
    <main>
        <h2 style="margin-bottom: 5px;">Volunteer Console</h2>
        <p style="text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 0.9em; color: #666;">
            Create new social hits or cancel active court schedules.
        </p>

        <!-- Create Session Interface -->
        <div id="form-section" style="display: block;">
            <h3 style="margin-top:0; color: var(--color-primary-accent);">➕ Add Session</h3>
            <form id="volunteerEventForm">
                <label>Title</label>
                <input type="text" name="title" required placeholder="e.g., Intermediate Social Hit at Welwyn">

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Time Slot</label>
                        <input type="text" name="time" required placeholder="e.g., 10am-12pm">
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 2;">
                        <label>Location</label>
                        <input type="text" name="location" required placeholder="e.g., Welwyn Tennis Park">
                    </div>
                    <div style="flex: 1;">
                        <label>Max Players</label>
                        <input type="number" name="maxPlayers" min="1" required placeholder="e.g., 8">
                    </div>
                </div>

                <label>Description (Links allowed)</label>
                <textarea name="description" rows="3" placeholder="Paste session guidelines or court booking reference links here..."></textarea>

                <button type="submit" id="publishBtn" class="cta-button primary" style="width:100%; border:none; margin-top:10px; cursor:pointer;">
                    Publish Live Event
                </button>
            </form>
            <p id="formStatus" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
        </div>

        <!-- Management Feed Tracker -->
        <h3 style="margin-top: 40px; margin-bottom: 5px;">Scheduled Sessions Log</h3>
        <div id="management-list" class="session-list">
            <p style="text-align:center; color: var(--color-secondary-accent)">Synchronizing with spreadsheet...</p>
        </div>
    </main>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyFKVI7nPYLqD8wj0Hjg1rlMeUhGWSE2ap8Xo4fqd7IeUFyl72zeNELpQq1RjzsYbWB/exec";

    // Fetch and populate volunteer dashboard rows
    function syncDashboardRoster() {
        const list = document.getElementById('management-list');
        
        fetch(API)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                
                // Sort chronologically by date descending (Newest first)
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (data.length === 0) {
                    list.innerHTML = "<p style='text-align:center; color:#999;'>No log events found.</p>";
                    return;
                }

                data.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'management-card';
                    
                    const d = new Date(ev.date);
                    const eventDate = isNaN(d) ? ev.date : d.toLocaleDateString('en-GB', { 
                        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' 
                    });

                    const isCancelable = (ev.status.toLowerCase() === 'active');
                    const cancelBtnHTML = isCancelable 
                        ? `<button class="cancel-action-btn" onclick="executeEventCancellation('${ev.id}')">Cancel</button>` 
                        : '';

                    card.innerHTML = `
                        <div class="card-info">
                            <span class="status-badge ${ev.status.toLowerCase()}">${ev.status}</span>
                            <h4 class="card-title">${ev.title}</h4>
                            <div class="card-meta">📅 ${eventDate} | ⏰ ${ev.time || 'TBA'}</div>
                            <div class="card-meta">📍 ${ev.location || 'TBA'}</div>
                        </div>
                        <div>
                            ${cancelBtnHTML}
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                list.innerHTML = "<p style='text-align:center; color:red;'>Error updating registry view.</p>";
            });
    }

    // Submit Request to Create New Event
    document.getElementById('volunteerEventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const status = document.getElementById('formStatus');
        const btn = document.getElementById('publishBtn');
        
        btn.disabled = true;
        status.style.color = "#666";
        status.innerText = "Appending to spreadsheet registry...";

        const params = new URLSearchParams(new FormData(this));
        params.append('action', 'createEvent');

        fetch(API, {
            method: 'POST',
            body: params,
            mode: 'no-cors'
        }).then(() => {
            status.style.color = "var(--color-secondary-accent)";
            status.innerText = "Success! Event is now live on social.html. 🎾";
            document.getElementById('volunteerEventForm').reset();
            btn.disabled = false;
            syncDashboardRoster();
        }).catch(err => {
            status.style.color = "red";
            status.innerText = "Error deploying session details.";
            btn.disabled = false;
        });
    });

    // Trigger Event Status Flip to Cancelled
    window.executeEventCancellation = function(eventId) {
        if (!confirm("Are you sure you want to cancel this event? This will change status to 'Cancelled' and update the user page immediately.")) return;

        const params = new URLSearchParams();
        params.append('action', 'cancelEvent');
        params.append('eventId', eventId);

        fetch(API, {
            method: 'POST',
            body: params,
            mode: 'no-cors'
        }).then(() => {
            alert('Event status updated successfully!');
            syncDashboardRoster();
        }).catch(err => {
            alert('Failed to update event status entries.');
        });
    };

    // Load content automatically
    document.addEventListener('DOMContentLoaded', syncDashboardRoster);
</script>

<div id="footer-placeholder"></div>
<script src="js/scripts.js"></script>
</body>
</html>
